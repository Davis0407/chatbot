<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Bot 🌸</title>
    
    <!-- Librerías Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- =====================================================================
         1. BLOQUE DE ESTILOS (CSS)
         ===================================================================== -->
    <style>
        /* Tipografía general */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Personalización de Barra de Desplazamiento */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Animaciones CSS */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        /* Indicador de escritura (Puntos animados) */
        .typing-dot {
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>

<body class="h-full bg-gradient-to-br from-rose-50 via-pink-50/50 to-orange-50/60 text-slate-700 flex flex-col justify-between antialiased">

    <!-- Encabezado / Header -->
    <header class="w-full bg-white/85 backdrop-blur-md border-b border-rose-100/60 px-4 py-3 sm:px-6 sticky top-0 z-20 flex items-center justify-between shadow-xs">
        <div class="flex items-center space-x-3">
            <div class="relative">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-rose-400 to-pink-400 flex items-center justify-center text-white shadow-md shadow-rose-200/50 font-bold text-lg">
                    🤖
                </div>
                <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-400 border-2 border-white rounded-full" title="En línea"></span>
            </div>
            <div>
                <h1 class="font-bold text-slate-800 text-base sm:text-lg flex items-center gap-1.5">
                    Bot <span>✨</span>
                </h1>
                <p class="text-xs text-emerald-600 font-medium flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span> En línea
                </p>
            </div>
        </div>
        
        <button id="clearChatBtn" title="Reiniciar conversación" class="p-2 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition-colors">
            <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
        </button>
    </header>

    <!-- Área de Conversación -->
    <main id="chatContainer" class="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 overflow-y-auto space-y-4 flex flex-col">
        <!-- Los mensajes se insertan dinámicamente mediante JS -->
    </main>

    <!-- Botones de Sugerencias Rápidas -->
    <div class="max-w-3xl w-full mx-auto px-4 sm:px-6 pb-2">
        <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
            <button onclick="sendQuickPrompt('¿Cómo va tu día? Cuéntame algo lindo')" class="text-xs bg-white/80 hover:bg-rose-50 border border-rose-100/80 text-rose-700 px-3 py-1.5 rounded-full whitespace-nowrap shadow-xs transition-all hover:scale-[1.02]">
                🌸 ¿Cómo va tu día?
            </button>
            <button onclick="sendQuickPrompt('Recomiéndame una serie o película acogedora')" class="text-xs bg-white/80 hover:bg-rose-50 border border-rose-100/80 text-rose-700 px-3 py-1.5 rounded-full whitespace-nowrap shadow-xs transition-all hover:scale-[1.02]">
                🎬 Película acogedora
            </button>
            <button onclick="sendQuickPrompt('Necesito motivación para hoy, ¡dime algo bonito!')" class="text-xs bg-white/80 hover:bg-rose-50 border border-rose-100/80 text-rose-700 px-3 py-1.5 rounded-full whitespace-nowrap shadow-xs transition-all hover:scale-[1.02]">
                ✨ Motivación del día
            </button>
        </div>
    </div>

    <!-- Pie de página / Entrada de texto -->
    <footer class="w-full bg-white/90 backdrop-blur-md border-t border-rose-100/60 p-4 sm:p-6 shadow-sm">
        <form id="chatForm" class="max-w-3xl mx-auto flex items-center gap-3">
            <div class="relative flex-1">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="Escribe tu mensaje, Stephanie..." 
                    class="w-full bg-slate-50/80 border border-slate-200/80 rounded-2xl px-4 py-3.5 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-rose-400/50 focus:border-rose-400 transition-all placeholder:text-slate-400 text-slate-700 pr-12 shadow-inner"
                    autocomplete="off"
                >
            </div>
            <button 
                type="submit" 
                id="sendButton"
                class="bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white p-3.5 rounded-2xl shadow-md shadow-rose-500/25 transition-all hover:scale-105 active:scale-95 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100"
            >
                <i data-lucide="send" class="w-5 h-5"></i>
            </button>
        </form>
    </footer>

    <!-- =====================================================================
         2. BLOQUE DE LÓGICA (JAVASCRIPT)
         ===================================================================== -->
    <script>
        // Inicializar Iconos
        lucide.createIcons();

        // Referencias a Elementos del DOM
        const chatContainer = document.getElementById('chatContainer');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const clearChatBtn = document.getElementById('clearChatBtn');

        // Estado y Configuración de la Conversación
        let chatHistory = [];
        let typingIndicatorEl = null;

        // Clave para guardar en el almacenamiento local del dispositivo (localStorage)
        const STORAGE_KEY = 'chat_historial_stephanie';

        // Instrucción del Sistema
        const SYSTEM_INSTRUCTION = "Tu nombre es 'Bot'. Eres un asistente de IA buena onda, amigable, amable y muy atento pero no tan intenso que conversa exclusivamente con tu amiga Stephanie. Sabes perfectamente que ella se llama Stephanie, salúdala con amabilidad y mantén siempre una actitud amable, empática y comprensiva.";

        // --- FUNCIONES DE INTERFAZ DE USUARIO (UI) ---

        // Renderiza un mensaje en el chat visualmente
        function renderMessage({ role, text }) {
            const isUser = role === 'user';
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'} w-full animate-fade-in`;

            const innerContainer = document.createElement('div');
            innerContainer.className = `flex items-end gap-2.5 max-w-[85%] sm:max-w-[75%] ${isUser ? 'flex-row-reverse' : 'flex-row'}`;

            // Avatar
            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-xl flex items-center justify-center text-xs font-bold shrink-0 shadow-xs ${
                isUser ? 'bg-rose-500 text-white' : 'bg-gradient-to-br from-purple-400 to-pink-400 text-white'
            }`;
            avatar.textContent = isUser ? 'S' : '🤖';

            // Burbuja de texto
            const bubble = document.createElement('div');
            bubble.className = `p-4 rounded-2xl text-sm sm:text-base leading-relaxed shadow-xs ${
                isUser 
                    ? 'bg-rose-500 text-white rounded-br-xs' 
                    : 'bg-white text-slate-700 border border-rose-100/70 rounded-bl-xs'
            }`;
            bubble.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');

            innerContainer.appendChild(avatar);
            innerContainer.appendChild(bubble);
            messageDiv.appendChild(innerContainer);
            chatContainer.appendChild(messageDiv);

            // Auto-scroll al último mensaje
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Muestra animación de "Bot está escribiendo..."
        function showTypingIndicator() {
            if (typingIndicatorEl) return;
            const messageDiv = document.createElement('div');
            messageDiv.id = 'typingIndicator';
            messageDiv.className = `flex justify-start w-full animate-fade-in`;

            const innerContainer = document.createElement('div');
            innerContainer.className = `flex items-end gap-2.5`;

            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-xl bg-gradient-to-br from-purple-400 to-pink-400 text-white flex items-center justify-center text-xs font-bold shrink-0 shadow-xs`;
            avatar.textContent = '🤖';

            const bubble = document.createElement('div');
            bubble.className = `p-4 rounded-2xl bg-white text-slate-700 border border-rose-100/70 rounded-bl-xs flex items-center space-x-1.5 h-10 shadow-xs`;
            
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = `w-2 h-2 bg-rose-400 rounded-full typing-dot`;
                bubble.appendChild(dot);
            }

            innerContainer.appendChild(avatar);
            innerContainer.appendChild(bubble);
            messageDiv.appendChild(innerContainer);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            typingIndicatorEl = messageDiv;
        }

        // Oculta animación de escritura
        function hideTypingIndicator() {
            if (typingIndicatorEl) {
                typingIndicatorEl.remove();
                typingIndicatorEl = null;
            }
        }

        // Escapar caracteres HTML para prevención XSS
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Enviar sugerencias rápidas
        window.sendQuickPrompt = function(promptText) {
            userInput.value = promptText;
            chatForm.dispatchEvent(new Event('submit'));
        };

        // --- GESTIÓN DE PERSISTENCIA (LOCALSTORAGE) ---

        function saveHistoryToDevice() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
        }

        function loadHistoryFromDevice() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                try {
                    chatHistory = JSON.parse(savedData);
                    chatContainer.innerHTML = ''; // Limpiar contenedor
                    // Renderizar cada mensaje guardado en la pantalla
                    chatHistory.forEach(msg => {
                        const role = msg.role;
                        const text = msg.parts?.[0]?.text || '';
                        renderMessage({ role, text });
                    });
                    return true;
                } catch (e) {
                    console.error("Error al cargar el historial:", e);
                }
            }
            return false;
        }

        // --- COMUNICACIÓN CON GEMINI API ---

        async function fetchGeminiResponse(retryCount = 0) {
            const maxRetries = 3;
            const apiKey = "AQ.Ab8RN6JWDR5zLqv8VJq06O71NafiYg5n8ra_TuJKSKiw_LnFrQ"; // Tu clave original
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            const payload = {
                system_instruction: { // <--- Ajustado con guion bajo
                    parts: [{ text: SYSTEM_INSTRUCTION }]
                },
                contents: chatHistory
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errData = await response.json();
                    console.error("Detalle del error de la API:", errData);
                    throw new Error(`Error en la solicitud: ${response.status}`);
                }

                const result = await response.json();
                hideTypingIndicator();

                const candidate = result.candidates?.[0];
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const reply = candidate.content.parts[0].text;
                    renderMessage({ role: 'model', text: reply });
                    chatHistory.push({ role: 'model', parts: [{ text: reply }] });
                    saveHistoryToDevice(); // Guarda automáticamente en el dispositivo
                } else {
                    throw new Error("Estructura de respuesta no válida.");
                }
            } catch (error) {
                console.error("Error capturado:", error);
                if (retryCount < maxRetries) {
                    const backoffDelay = Math.pow(2, retryCount) * 1000;
                    await new Promise(res => setTimeout(res, backoffDelay));
                    return fetchGeminiResponse(retryCount + 1);
                }
                
                hideTypingIndicator();
                renderMessage({ 
                    role: 'model', 
                    text: 'Lo siento, Stephanie, hubo un pequeño problema al conectarme. ¿Me lo podrías repetir? 🌸' 
                });
            } finally {
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        // --- EVENT LISTENERS ---

        // Enviar Mensaje
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Deshabilitar entrada temporalmente
            userInput.value = '';
            userInput.disabled = true;
            sendButton.disabled = true;

            // Mostrar mensaje del usuario y actualizar historial
            renderMessage({ role: 'user', text });
            chatHistory.push({ role: 'user', parts: [{ text }] });
            saveHistoryToDevice(); // Guardar al enviar

            // Mostrar estado de carga y realizar petición
            showTypingIndicator();
            await fetchGeminiResponse();
        });

        // Reiniciar Chat (Borra el historial del dispositivo y reinicia)
        clearChatBtn.addEventListener('click', () => {
            if (confirm("¿Deseas reiniciar la conversación con Bot?")) {
                localStorage.removeItem(STORAGE_KEY);
                chatContainer.innerHTML = '';
                chatHistory = [];
                const greeting = '¡Hola de nuevo, Stephanie! ✨ ¿De qué te gustaría charlar ahora?';
                renderMessage({ role: 'model', text: greeting });
                chatHistory.push({ role: 'model', parts: [{ text: greeting }] });
                saveHistoryToDevice();
            }
        });

        // Inicialización al Cargar la Página
        window.addEventListener('DOMContentLoaded', () => {
            // Intentar cargar mensajes guardados previamente en el dispositivo
            const hasLoaded = loadHistoryFromDevice();

            // Si no hay historial previo, mostrar saludo inicial por defecto
            if (!hasLoaded || chatHistory.length === 0) {
                const initialGreeting = '¡Hola, Stephanie! 😊 Soy Bot. Qué gusto saludarte. ¿Cómo va tu día hoy? Estoy aquí para conversar de lo que quieras o acompañarte un rato. ✨';
                renderMessage({ role: 'model', text: initialGreeting });
                chatHistory.push({ role: 'model', parts: [{ text: initialGreeting }] });
                saveHistoryToDevice();
            }
        });
    </script>
</body>
</html>
